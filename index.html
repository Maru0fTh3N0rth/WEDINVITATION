<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Timm & Julia – Hochzeit</title>

    <meta name="description" content="Einladung zur Hochzeit von Timm & Julia">


    <!-- =====================================================
         SCHRIFTEN
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">


    <style>
        /* =====================================================
           FARBEN
        ====================================================== */

        :root {

            --rosa: #c27f88;

            --rosa-dunkel: #a95f69;

            --rosa-hell: #e4b9bd;

            --beige: #f4e7dc;

            --gruen: #899783;

            --gruen-dunkel: #687663;

            --braun: #68564f;

            --gold: #b99a68;

        }



        /* =====================================================
           GRUNDLAYOUT
        ====================================================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                'Montserrat',
                sans-serif;

            color:
                var(--braun);


            background-image:

                linear-gradient(rgba(245, 220, 220, 0.04),
                    rgba(244, 232, 220, 0.04)),

                url('https://i.ibb.co/q3X1rtFy/1787837393182-2.jpg'
                );


            background-size: cover;

            background-position:
                center center;

            background-repeat: no-repeat;

            background-attachment: fixed;

        }



        /* =====================================================
           RANKEN
        ====================================================== */

        .vine-left,
        .vine-right {

            position: fixed;

            top: 0;

            bottom: 0;

            width: 100px;

            pointer-events: none;

            z-index: 1;

            opacity: 0.35;

        }


        .vine-left {

            left: 0;

            border-left:
                2px solid rgba(104, 118, 99, 0.6);

            border-radius:
                0 0 0 90%;

            transform:
                translateX(-45px) rotate(-4deg);

        }


        .vine-right {

            right: 0;

            border-right:
                2px solid rgba(104, 118, 99, 0.6);

            border-radius:
                0 90% 0 0;

            transform:
                translateX(45px) rotate(4deg);

        }


        .vine-left::before,
        .vine-left::after,
        .vine-right::before,
        .vine-right::after {

            content: "❧";

            position: absolute;

            font-size: 40px;

            color:
                var(--gruen-dunkel);

        }


        .vine-left::before {

            top: 20%;

            right: -30px;

            transform:
                rotate(-25deg);

        }


        .vine-left::after {

            top: 70%;

            right: -30px;

            transform:
                rotate(15deg);

        }


        .vine-right::before {

            top: 35%;

            left: -30px;

            transform:
                scaleX(-1) rotate(-20deg);

        }


        .vine-right::after {

            top: 80%;

            left: -30px;

            transform:
                scaleX(-1) rotate(15deg);

        }



        /* =====================================================
           HEADER
        ====================================================== */

        header {

            position: relative;

            z-index: 5;

            padding:
                27px 20px;

            text-align: center;

            background:
                rgba(178, 116, 124, 0.68);

            border-bottom:
                1px solid rgba(255, 255, 255, 0.45);

            box-shadow:
                0 5px 25px rgba(70, 50, 45, 0.12);

        }


        .header-small {

            font-size:
                0.7rem;

            letter-spacing:
                5px;

            text-transform:
                uppercase;

            color:
                #fff5f3;

        }


        .header-title {

            margin:
                7px 0;

            font-family:
                'Great Vibes',
                cursive;

            font-size:
                clamp(3rem,
                    8vw,
                    4.6rem);

            font-weight:
                400;

            line-height:
                1;

            color:
                white;

        }


        .header-ornament {

            color:
                #efd0d2;

            font-size:
                1.4rem;

        }



        /* =====================================================
           HAUPTBEREICH
        ====================================================== */

        #mainDisplay {

            position:
                relative;

            z-index:
                3;

            width:
                min(1050px,
                    94%);

            margin:
                35px auto 60px;

        }



        /* =====================================================
           LOGIN
        ====================================================== */

        #login {

            position:
                relative;

            max-width:
                720px;

            margin:
                45px auto;

            padding:
                50px 30px 55px;

            text-align:
                center;

            background:
                rgba(255,
                    242,
                    239,
                    0.34);

            border:
                1px solid rgba(255,
                    255,
                    255,
                    0.60);

            border-radius:
                42px;

            box-shadow:
                0 18px 50px rgba(75,
                    55,
                    50,
                    0.12);

            overflow:
                hidden;

        }


        #login::before {

            content:
                "❦";

            position:
                absolute;

            left:
                12px;

            top:
                0;

            font-size:
                85px;

            color:
                rgba(194,
                    127,
                    136,
                    0.40);

            transform:
                rotate(-25deg);

        }


        #login::after {

            content:
                "❦";

            position:
                absolute;

            right:
                12px;

            bottom:
                0;

            font-size:
                85px;

            color:
                rgba(137,
                    151,
                    131,
                    0.35);

            transform:
                rotate(155deg);

        }



        /* =====================================================
           STARTSEITE
        ====================================================== */

        .welcome-small {

            margin-top:
                10px;

            font-size:
                0.7rem;

            letter-spacing:
                5px;

            text-transform:
                uppercase;

            color:
                var(--gruen-dunkel);

        }


        .welcome-title {

            margin:
                8px 0;

            font-family:
                'Great Vibes',
                cursive;

            font-size:
                clamp(4rem,
                    13vw,
                    6.5rem);

            font-weight:
                400;

            line-height:
                0.85;

            color:
                var(--braun);

        }


        .welcome-and {

            margin:
                17px 0;

            font-family:
                'Great Vibes',
                cursive;

            font-size:
                3rem;

            color:
                var(--rosa);

        }


        .welcome-date {

            margin:
                30px 0 18px;

            font-family:
                'Cormorant Garamond',
                serif;

            font-size:
                1.8rem;

            color:
                var(--gruen-dunkel);

        }


        .welcome-text {

            max-width:
                500px;

            margin:
                0 auto 30px;

            line-height:
                1.9;

            font-size:
                0.9rem;

        }



        /* =====================================================
           NAME
        ====================================================== */

        .name-label {

            display:
                block;

            margin-bottom:
                10px;

            font-family:
                'Great Vibes',
                cursive;

            font-size:
                2.8rem;

            line-height:
                1.1;

            color:
                var(--rosa-dunkel);

        }


        #nameInput {

            width:
                min(100%,
                    330px);

            padding:
                14px 18px;

            border:
                none;

            border-bottom:
                1px solid var(--rosa);

            outline:
                none;

            background:
                rgba(255,
                    255,
                    255,
                    0.30);

            border-radius:
                15px 15px 0 0;

            text-align:
                center;

            font-family:
                'Montserrat',
                sans-serif;

            font-size:
                1rem;

            color:
                var(--braun);

        }


        #nameInput:focus {

            border-bottom-color:
                var(--gruen);

            background:
                rgba(255,
                    255,
                    255,
                    0.45);

        }



        /* =====================================================
           BUTTON
        ====================================================== */

        .main-button {

            margin-top:
                24px;

            padding:
                14px 34px;

            border:
                none;

            border-radius:
                30px;

            background:
                rgba(173,
                    104,
                    114,
                    0.90);

            color:
                white;

            font-family:
                'Montserrat',
                sans-serif;

            font-size:
                0.72rem;

            letter-spacing:
                2px;

            text-transform:
                uppercase;

            cursor:
                pointer;

            box-shadow:
                0 7px 20px rgba(120,
                    80,
                    80,
                    0.15);

            transition:
                all 0.3s ease;

        }


        .main-button:hover {

            background:
                rgba(137,
                    151,
                    131,
                    0.92);

            transform:
                translateY(-2px);

        }



        /* =====================================================
           PERSONAL HEADER
        ====================================================== */

        .personal-header {

            position:
                relative;

            padding:
                40px 25px;

            text-align:
                center;

            background:
                rgba(255,
                    242,
                    239,
                    0.34);

            border:
                1px solid rgba(255,
                    255,
                    255,
                    0.62);

            border-radius:
                42px;

            box-shadow:
                0 15px 40px rgba(70,
                    55,
                    50,
                    0.10);

            overflow:
                hidden;

        }


        .personal-header::before {

            content:
                "❦";

            position:
                absolute;

            left:
                15px;

            top:
                5px;

            font-size:
                60px;

            color:
                rgba(194,
                    127,
                    136,
                    0.42);

            transform:
                rotate(-20deg);

        }


        .personal-header::after {

            content:
                "❦";

            position:
                absolute;

            right:
                15px;

            bottom:
                5px;

            font-size:
                60px;

            color:
                rgba(137,
                    151,
                    131,
                    0.35);

            transform:
                rotate(160deg);

        }


        .personal-small {

            font-family:
                'Great Vibes',
                cursive;

            font-size:
                clamp(3rem,
                    8vw,
                    4.5rem);

            line-height:
                1.1;

            color:
                var(--rosa-dunkel);

        }


        .personal-title {

            margin:
                12px 0;

            font-family:
                'Great Vibes',
                cursive;

            font-size:
                clamp(4rem,
                    11vw,
                    6rem);

            line-height:
                0.95;

            color:
                var(--braun);

        }


        .personal-title span {

            color:
                var(--rosa);

            font-size:
                0.7em;

        }


        .personal-date {

            font-family:
                'Cormorant Garamond',
                serif;

            font-size:
                1.6rem;

            color:
                var(--gruen-dunkel);

        }



        /* =====================================================
           NAVIGATION
        ====================================================== */

        nav {

            display:
                flex;

            justify-content:
                center;

            flex-wrap:
                wrap;

            gap:
                10px;

            margin:
                25px auto;

            max-width:
                850px;

        }


        nav button {

            padding:
                12px 20px;

            border:
                1px solid rgba(173,
                    104,
                    114,
                    0.55);

            border-radius:
                28px;

            background:
                rgba(255,
                    242,
                    239,
                    0.38);

            color:
                var(--braun);

            font-family:
                'Montserrat',
                sans-serif;

            font-size:
                0.72rem;

            letter-spacing:
                1px;

            cursor:
                pointer;

            transition:
                all 0.3s ease;

        }


        nav button:hover {

            background:
                rgba(173,
                    104,
                    114,
                    0.86);

            color:
                white;

            transform:
                translateY(-2px);

        }



        /* =====================================================
           CONTENT CARDS
        ====================================================== */

        .content-card {

            max-width:
                850px;

            margin:
                25px auto 50px;

            padding:
                50px 35px;

            text-align:
                center;

            background:
                rgba(255,
                    242,
                    239,
                    0.32);

            border:
                1px solid rgba(255,
                    255,
                    255,
                    0.60);

            border-radius:
                40px;

            box-shadow:
                0 15px 45px rgba(70,
                    55,
                    50,
                    0.09);

            animation:
                fadeIn 0.45s ease;

        }


        @keyframes fadeIn {

            from {

                opacity:
                    0;

                transform:
                    translateY(10px);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);

            }

        }


        .content-card h2 {

            margin:
                0 0 35px;

            font-family:
                'Great Vibes',
                cursive;

            font-size:
                clamp(3.2rem,
                    9vw,
                    4.7rem);

            font-weight:
                400;

            line-height:
                1;

            color:
                var(--rosa-dunkel);

        }


        .content-card h2::after {

            content:
                "❦";

            display:
                block;

            margin-top:
                10px;

            font-family:
                'Cormorant Garamond',
                serif;

            font-size:
                1.5rem;

            color:
                var(--gold);

        }


        .content-card h3 {

            margin-bottom:
                8px;

            font-family:
                'Cormorant Garamond',
                serif;

            font-size:
                1.8rem;

            color:
                var(--gruen-dunkel);

        }


        .content-card p {

            line-height:
                1.9;

            font-size:
                0.92rem;

        }



        /* =====================================================
           DATEN
        ====================================================== */

        .daten-container {

            display:
                grid;

            grid-template-columns:
                repeat(2,
                    1fr);

            gap:
                22px;

            max-width:
                700px;

            margin:
                auto;

        }


        .daten {

            padding:
                28px 20px;

            background:
                rgba(255,
                    255,
                    255,
                    0.25);

            border:
                1px solid rgba(255,
                    255,
                    255,
                    0.46);

            border-radius:
                30px;

        }



        /* =====================================================
           TIMELINE
        ====================================================== */

        .timeline {

            max-width:
                600px;

            margin:
                auto;

            text-align:
                left;

        }


        .timeline-item {

            position:
                relative;

            padding:
                0 0 35px 35px;

            border-left:
                1px solid rgba(194,
                    127,
                    136,
                    0.55);

        }


        .timeline-item:last-child {

            border-left-color:
                transparent;

        }


        .timeline-item::before {

            content:
                "";

            position:
                absolute;

            left:
                -6px;

            top:
                0;

            width:
                11px;

            height:
                11px;

            border-radius:
                50%;

            background:
                var(--rosa);

        }


        .timeline-time {
            display: inline-block;

            font-family:
                'Cormorant Garamond',
                serif;

            font-size: 1.6rem;
            font-weight: 600;

            color: var(--gold);

            background:
                rgba(255, 245, 242, 0.55);

            padding:
                4px 14px;

            border-radius: 20px;

            letter-spacing: 0.5px;

            text-shadow:
                0 1px 1px rgba(255, 255, 255, 0.5);

            margin-bottom: 5px;
        }


        /* =====================================================
           GETRÄNKE
        ====================================================== */

        .drink-grid {

            display:
                grid;

            grid-template-columns:
                repeat(2,
                    1fr);

            gap:
                14px;

            max-width:
                600px;

            margin:
                30px auto;

        }


        .drink-option {

            position:
                relative;

        }


        .drink-option input {

            position:
                absolute;

            opacity:
                0;

        }


        .drink-option label {

            display:
                block;

            padding:
                18px 15px;

            border:
                1px solid rgba(194,
                    127,
                    136,
                    0.35);

            border-radius:
                25px;

            background:
                rgba(255,
                    255,
                    255,
                    0.22);

            cursor:
                pointer;

            transition:
                all 0.25s ease;

        }


        .drink-option label:hover {

            background:
                rgba(255,
                    255,
                    255,
                    0.38);

            transform:
                translateY(-2px);

        }


        .drink-option input:checked+label {

            background:
                rgba(194,
                    127,
                    136,
                    0.58);

            color:
                white;

            border-color:
                var(--rosa-dunkel);

            box-shadow:
                0 5px 18px rgba(120,
                    80,
                    80,
                    0.12);

        }


        .drink-icon {

            display:
                block;

            font-size:
                1.7rem;

            margin-bottom:
                5px;

        }


        .vote-button {

            padding:
                14px 28px;

            border:
                none;

            border-radius:
                30px;

            background:
                var(--rosa-dunkel);

            color:
                white;

            font-family:
                'Montserrat',
                sans-serif;

            font-size:
                0.75rem;

            letter-spacing:
                1px;

            cursor:
                pointer;

            transition:
                0.25s;

        }


        .vote-button:hover {

            transform:
                translateY(-2px);

            background:
                var(--gruen-dunkel);

        }


        .vote-button:disabled {

            opacity:
                0.5;

            cursor:
                not-allowed;

        }


        .undo-button {

            margin-top:
                15px;

            padding:
                10px 20px;

            border:
                1px solid rgba(173,
                    104,
                    114,
                    0.45);

            border-radius:
                25px;

            background:
                rgba(255,
                    255,
                    255,
                    0.20);

            color:
                var(--rosa-dunkel);

            font-family:
                'Montserrat',
                sans-serif;

            font-size:
                0.7rem;

            cursor:
                pointer;

        }


        .undo-button:hover {

            background:
                rgba(173,
                    104,
                    114,
                    0.15);

        }


        .vote-status {

            margin:
                20px auto;

            max-width:
                500px;

            padding:
                15px;

            border-radius:
                20px;

            background:
                rgba(255,
                    255,
                    255,
                    0.20);

            font-size:
                0.85rem;

        }



        /* =====================================================
           ESSEN
        ====================================================== */

        .food-choice {

            max-width:
                550px;

            margin:
                30px auto;

        }


        .food-option {

            display:
                block;

            margin:
                12px 0;

        }


        .food-option input {

            display:
                none;

        }


        .food-option label {

            display:
                block;

            padding:
                20px;

            border:
                1px solid rgba(194,
                    127,
                    136,
                    0.35);

            border-radius:
                28px;

            background:
                rgba(255,
                    255,
                    255,
                    0.22);

            cursor:
                pointer;

            transition:
                0.25s;

        }


        .food-option label:hover {

            background:
                rgba(255,
                    255,
                    255,
                    0.38);

        }


        .food-option input:checked+label {

            background:
                rgba(194,
                    127,
                    136,
                    0.58);

            color:
                white;

            border-color:
                var(--rosa-dunkel);

        }


        .food-note {

            margin:
                30px auto;

            padding:
                25px;

            max-width:
                600px;

            border-radius:
                30px;

            background:
                rgba(194,
                    127,
                    136,
                    0.18);

            border:
                1px solid rgba(173,
                    104,
                    114,
                    0.25);

        }


        .food-note strong {

            color:
                var(--rosa-dunkel);

        }

        /* ==================== SPEISEKARTE ==================== */



        .tab-content{
            max-width:
                850px;

            margin:
                25px auto 50px;

            padding:
                50px 35px;

            background:
                rgba(255,
                    242,
                    239,
                    0.32);

            border:
                1px solid rgba(255,
                    255,
                    255,
                    0.60);

            border-radius:
                40px;

            box-shadow:
                0 15px 45px rgba(70,
                    55,
                    50,
                    0.09);

            animation:
                fadeIn 0.45s ease;
        }

        .menu-categories {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0 25px 0;
            justify-content: center;
        }

        .menu-categories a {
            text-decoration: none;
            padding: 8px 13px;
            border-radius: 20px;
            background: var(--card-bg, #ffffff);
            border: 1px solid var(--border-color, #ddd);
            color: var(--primary-color, #333);
            font-size: 0.9rem;
            transition: 0.2s ease;
        }

        .menu-categories a:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        }

        .menu-category {
            scroll-margin-top: 20px;
            margin-bottom: 28px;
        }

        .menu-category h3 {
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent-color, #8c2318);
            color: var(--accent-color, #8c2318);
        }

        .menu-entry {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            padding: 10px 4px;
            border-bottom: 1px dashed var(--border-color, #ddd);
        }

        .menu-entry>div {
            flex: 1;
        }

        .menu-entry strong {
            display: block;
            font-size: 0.98rem;
        }

        .menu-entry small {
            display: block;
            margin-top: 3px;
            color: var(--text-muted, #777);
            font-size: 0.84rem;
            line-height: 1.4;
        }

        .menu-entry>span {
            white-space: nowrap;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .menu-note {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(140, 35, 24, 0.06);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .menu-allergens {
            margin-top: 30px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.035);
            font-size: 0.78rem;
            line-height: 1.5;
            color: var(--text-muted, #777);
        }

        @media (max-width: 600px) {

            .menu-categories {

        /* =====================================================
           GETRÄNKE ABSENDEN
        ====================================================== */

        async function submitDrinks() {

            const checkboxes =
                document.querySelectorAll(
                    '.drink-option input:checked'
                );


            const drinks =
                Array.from(
                    checkboxes
                ).map(
                    checkbox =>
                        checkbox.value
                );


            if (
                drinks.length === 0
            ) {

                alert(
                    "Bitte wähle mindestens ein Getränk aus. 🥂"
                );

                return;

            }


            const alreadyVoted =
                localStorage.getItem(
                    "hochzeitDrinks"
                );


            if (alreadyVoted) {

                alert(
                    "Du hast deine Getränke bereits ausgewählt. 😊"
                );

                return;

            }


            const button =
                document.getElementById(
                    "drinkSubmit"
                );


            button.disabled =
                true;


            button.textContent =
                "Wird gespeichert …";


            const success =
                await sendToGoogle({
                    type: "drinks",
                    action: "submit",
                    drinks: drinks
                });


            if (success) {

                localStorage.setItem(
                    "hochzeitDrinks",
                    JSON.stringify(drinks)
                );


                updateDrinkStatus();


                alert(
                    "Danke! Deine Getränkeauswahl wurde gespeichert. 🥂"
                );

            }


            else {

                button.disabled =
                    false;

                button.textContent =
                    "Getränke speichern 🥂";

            }

        }



        /* =====================================================
           GETRÄNKE RÜCKGÄNGIG
        ====================================================== */

        async function undoDrinks() {

            const saved =
                localStorage.getItem(
                    "hochzeitDrinks"
                );


            if (!saved) {

                alert(
                    "Es gibt keine gespeicherte Getränkeabstimmung zum Zurücknehmen."
                );

                return;

            }


            let drinks;


            try {

                drinks =
                    JSON.parse(saved);

            }

            catch (e) {

                alert(
                    "Die gespeicherte Auswahl konnte nicht gelesen werden."
                );

                return;

            }


            if (
                !confirm(
                    "Möchtest du deine Getränkeauswahl wirklich zurücknehmen?"
                )
            ) {

                return;

            }


            const success =
                await sendToGoogle({
                    type: "drinks",
                    action: "undo",
                    drinks: drinks
                });


            if (success) {

                localStorage.removeItem(
                    "hochzeitDrinks"
                );


                showDrinks();


                alert(
                    "Deine Getränkeabstimmung wurde zurückgenommen. ↩️"
                );

            }

        }



        /* =====================================================
           GETRÄNKE STATUS
        ====================================================== */

        function updateDrinkStatus() {

            const saved =
                localStorage.getItem(
                    "hochzeitDrinks"
                );


            const status =
                document.getElementById(
                    "drinkStatus"
                );


            const submit =
                document.getElementById(
                    "drinkSubmit"
                );


            const undo =
                document.getElementById(
                    "drinkUndo"
                );


            if (!status) {
                return;
            }


            if (saved) {

                let drinks =
                    [];

                try {

                    drinks =
                        JSON.parse(saved);

                }

                catch (e) { }



                status.innerHTML = `

                    💕 Deine Getränkeauswahl
                    wurde gespeichert.

                    <br><br>

                    Du hast ausgewählt:

                    <strong>
                        ${drinks.join(", ")}
                    </strong>

                `;


                if (submit) {

                    submit.disabled =
                        true;

                    submit.textContent =
                        "Bereits abgestimmt ✓";

                }


                if (undo) {

                    undo.style.display =
                        "inline-block";

                }

            }


            else {

                status.innerHTML =
                    "Du hast hier noch nicht abgestimmt. 🌸";


                if (submit) {

                    submit.disabled =
                        false;

                    submit.textContent =
                        "Getränke speichern 🥂";

                }


                if (undo) {

                    undo.style.display =
                        "none";

                }

            }

        }

                        ↩ Essensauswahl zurücknehmen
                    </button>


                </section>

            `;


            updateFoodStatus();

        }



        /* =====================================================
           ESSEN ABSENDEN
        ====================================================== */

        async function submitFood() {

            const selected =
                document.querySelector(
                    'input[name="food"]:checked'
                );


            if (!selected) {

                alert(
                    "Bitte wähle aus, ob du mit zum Essen kommst. 🍽️"
                );

                return;

            }


            if (
                localStorage.getItem(
                    "hochzeitFood"
                )
            ) {

                alert(
                    "Du hast deine Essensauswahl bereits gespeichert. 😊"
                );

                return;

            }


            const choice =
                selected.value;


            const button =
                document.getElementById(
                    "foodSubmit"
                );


            button.disabled =
                true;


            button.textContent =
                "Wird gespeichert …";


            const success =
                await sendToGoogle({

                    type: "food",

                    action: "submit",

                    choice: choice

                });


            if (success) {

                localStorage.setItem(
                    "hochzeitFood",
                    choice
                );


                updateFoodStatus();


                alert(
                    "Danke! Deine Essensauswahl wurde gespeichert. 🍽️"
                );

            }


            else {

                button.disabled =
                    false;

                button.textContent =
                    "Essensauswahl speichern 🍽️";

            }

        }



        /* =====================================================
           ESSEN RÜCKGÄNGIG
        ====================================================== */

        async function undoFood() {

            const choice =
                localStorage.getItem(
                    "hochzeitFood"
                );


            if (!choice) {

                alert(
                    "Es gibt keine gespeicherte Essensabstimmung zum Zurücknehmen."
                );

                return;

            }


            if (
                !confirm(
                    "Möchtest du deine Essensauswahl wirklich zurücknehmen?"
                )
            ) {

                return;

            }


            const success =
                await sendToGoogle({

                    type: "food",

                    action: "undo",

                    choice: choice

                });


            if (success) {

                localStorage.removeItem(
                    "hochzeitFood"
                );


                showFood();


                alert(
                    "Deine Essensabstimmung wurde zurückgenommen. ↩️"
                );

            }

        }



        /* =====================================================
           ESSEN STATUS
        ====================================================== */

        function updateFoodStatus() {

            const saved =
                localStorage.getItem(
                    "hochzeitFood"
                );


            const status =
                document.getElementById(
                    "foodStatus"
                );


            const submit =
                document.getElementById(
                    "foodSubmit"
                );


            const undo =
                document.getElementById(
                    "foodUndo"
                );


            if (!status) {
                return;
            }


            if (saved === "yes") {

                status.innerHTML = `

                    💕 Deine Essensauswahl
                    wurde gespeichert.

                    <br><br>

                    Du kommst mit zum Essen. 🍽️

                `;


                if (submit) {

                    submit.disabled =
                        true;

                    submit.textContent =
                        "Bereits abgestimmt ✓";

                }


                if (undo) {

                    undo.style.display =
                        "inline-block";

                }

            }


            else if (saved === "no") {

                status.innerHTML = `

                    💕 Deine Essensauswahl
                    wurde gespeichert.

                    <br><br>

                    Du kommst nicht mit zum Essen.

                `;


                if (submit) {

                    submit.disabled =
                        true;

                    submit.textContent =
                        "Bereits abgestimmt ✓";

                }


                if (undo) {

                    undo.style.display =
                        "inline-block";

                }

            }


            else {

                status.innerHTML =
                    "Du hast hier noch nicht abgestimmt. 🌸";


                if (submit) {

                    submit.disabled =
                        false;

                    submit.textContent =
                        "Essensauswahl speichern 🍽️";

                }


                if (undo) {

                    undo.style.display =
                        "none";

                }

            }

        }

        /* =====================================================
           GOOGLE APPS SCRIPT
        ====================================================== */

        async function sendToGoogle(data) {

            try {

                const response =
                    await fetch(
                        GOOGLE_SCRIPT_URL,
                        {

                            method:
                                "POST",

                            /*
                               KEINE speziellen Header setzen.
                               Dadurch vermeiden wir unnötige
                               CORS-Preflight-Probleme.
                            */

                            body:
                                JSON.stringify(data)

                        }
                    );


                const result =
                    await response.json();


                if (
                    result.success
                ) {

                    return true;

                }


                alert(
                    "Leider konnte die Abstimmung nicht gespeichert werden. 😕"
                );


                console.error(
                    result.error
                );


                return false;

            }


            catch (error) {
                console.error(
                    error
                );


                alert(
                    "Die Verbindung zum Abstimmungsserver hat leider nicht funktioniert. Bitte versuche es noch einmal. 🌸"
                );
                return false;
            }

        }


    </script>
